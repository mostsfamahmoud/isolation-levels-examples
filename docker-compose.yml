services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: test
    ports:
      - "55432:5432"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: test
    ports:
      - "53306:3306"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Test_pass1!"
    ports:
      - "51433:1433"

  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: test
      APP_USER: app
      APP_USER_PASSWORD: test
    ports:
      - "51521:1521"
